name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-tests:
    name: Build and unit tests
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Release app
        run: |
          xcodebuild \
            -project MakeTask.xcodeproj \
            -scheme MakeTask \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/MakeTaskDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        run: |
          xcodebuild \
            -project MakeTask.xcodeproj \
            -scheme MakeTask \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/MakeTaskDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/MakeTaskTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:MakeTaskTests \
            test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MakeTaskTests-${{ github.run_id }}
          path: ${{ runner.temp }}/MakeTaskTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
